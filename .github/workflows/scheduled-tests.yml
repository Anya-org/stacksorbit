name: Scheduled Tests

# Weekly full test suite execution to catch regressions and environmental drift.
# Recommended for finding errors without blocking daily PR flow.

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full Test Suite | Python 3.11 | Node 22
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .[dev,test]
          pnpm install --frozen-lockfile

      - name: Run CI validation scripts
        run: |
          python3 scripts/verify_knowledge_retention.py
          python3 scripts/verify_tracked_artifacts.py
          python3 scripts/verify_contamination_safety.py
          python3 scripts/verify_compose_env_templates.py
          python3 scripts/verify_submodule_secret_filenames.py
          python3 scripts/verify_bos_production_boundary.py

      - name: Run Python unit tests
        run: pnpm run test:unit

      - name: Run Vitest tests
        run: pnpm run test:vitest

      - name: GUI smoke tests
        run: pnpm run test:gui
