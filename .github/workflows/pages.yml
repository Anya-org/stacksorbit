name: Deploy GitHub Pages

# Secure Pages deployment workflow with pinned actions and explicit permissions.
# Pinned to commit SHAs to prevent supply chain attacks via mutable tags.
# Updated to latest stable versions for Node 22 compatibility.

on:
  # Pages is not yet enabled for this repository. The `github-pages` environment
  # does not exist, and `configure-pages` fails without it. Restore `push` trigger
  # once an admin enables Pages in Settings → Pages → Source: GitHub Actions.
  # See: https://github.com/Conxian/conxian-business/issues/933
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Note: 'enablement: true' requires administration:write permission.
          # If this step fails with 'Resource not accessible', ensure Pages is
          # manually enabled in the repository settings (Build and deployment > Source: GitHub Actions).
          
      - name: Sync docs source
        run: bash ./scripts/sync-pages-includes.sh

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
