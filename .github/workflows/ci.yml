name: CI

# Secure CI workflow with pinned actions and explicit permissions.
# Pinned to commit SHAs to prevent supply chain attacks via mutable tags.
# Updated to latest stable versions for Node 22 compatibility.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: CI on ${{ matrix.os }} | Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '10'

      - name: Install tkinter (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail

          install_tk() {
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y python3-tk
          }

          if ! install_tk; then
            echo "Initial apt install failed; removing problematic Microsoft apt sources and retrying..."
            sudo rm -f /etc/apt/sources.list.d/*microsoft*.list /etc/apt/sources.list.d/*azure*.list /etc/apt/sources.list.d/vscode.list
            sudo apt-get clean
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --fix-missing python3-tk
          fi

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .[dev,test]

      - name: Prepare security audit tooling
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -m pip install safety

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          pnpm audit
          python -m safety scan

      - name: Lint (JS + Python + TS)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: pnpm run lint

      - name: Run unit tests
        if: matrix.os != 'windows-latest' && matrix.python-version != '3.8'
        run: pnpm run test:unit

      - name: Run Vitest tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: pnpm run test:vitest

      - name: GUI smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python3 scripts/verify_knowledge_retention.py
          python3 scripts/verify_tracked_artifacts.py
          python3 scripts/verify_contamination_safety.py
          python3 scripts/verify_compose_env_templates.py
          python3 scripts/verify_submodule_secret_filenames.py
          python3 scripts/verify_bos_production_boundary.py
          pnpm run test:gui

      - name: Upload coverage (optional)
        if: matrix.os == 'ubuntu-latest' && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
          fail_ci_if_error: false
