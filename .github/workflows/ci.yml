name: CI

# Secure CI workflow with pinned actions and explicit permissions.
# Pinned to commit SHAs to prevent supply chain attacks via mutable tags.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: CI on ${{ matrix.os }} | Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10'

      - name: Install tkinter (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev,test]
          pip install safety

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Run Audit
        run: pnpm run audit

      - name: Lint (JS + Python + TS)
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run Vitest tests
        run: pnpm run test:vitest

      - name: GUI smoke test
        run: pnpm run test:gui

      - name: Upload coverage (optional)
        if: matrix.os == 'ubuntu-latest' && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
          fail_ci_if_error: false
