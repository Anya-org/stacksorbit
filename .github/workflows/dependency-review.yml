name: Dependency Review

# Secure Dependency Review workflow with pinned action reference and explicit permissions.
# This workflow uses the shared Conxian repository definition for consistent policy enforcement.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependency-review:
    # Use the reusable workflow from the Conxian/.github repo.
    # The shared workflow is the source of truth for org-wide dependency policy
    # and already hardcodes fail-on-severity: high.
    uses: Conxian/.github/.github/workflows/dependency-review.yml@f6df6b138136b979653e8451f6f41076686732b3 # main
    permissions:
      contents: read
      pull-requests: write
